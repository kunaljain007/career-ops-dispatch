name: Daily 4:00 AM IST Email Dispatch (15/SMTP Warmup - 240 Total)

on:
  schedule:
    - cron: '30 22 * * *'  # 22:30 UTC = 4:00 AM IST daily
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute 80/SMTP Dispatch
        env:
          SMTP_POOL_JSON: ${{ secrets.SMTP_POOL_JSON }}
        run: |
          python dispatch_80_ci.py

      - name: Commit and push sent logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore(logs): update sent emails [skip ci]"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
