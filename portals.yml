# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # Executive Leadership, C-Suite & Freelancing Consulting Roles
    - "Chief Executive Officer"
    - "CEO"
    - "Managing Director"
    - "Country Manager"
    - "President"
    - "Chief Operating Officer"
    - "COO"
    - "Chief of Staff"
    - "Head of Strategy"
    - "Strategy Lead"
    - "Head of Operations"
    - "VP Strategy"
    - "Strategy Consultant"
    - "Management Consultant"
    - "Freelance Consultant"
    - "Fractional COO"
    - "Fractional Chief of Staff"
    - "Executive Advisor"
    - "Consultant"
    - "Professor"
    - "Lecturer"
    - "Faculty"
    - "Teaching"
    - "Instructor"
    - "Adjunct"
    - "Curriculum"
    - "Academic"
    - "Research Fellow"
    - "Dean"
    - "Education Lead"
    - "Training Manager"
    - "Learning and Development"
    - "L&D"
    - "Corporate Trainer"
    - "Head of Learning"
    - "Tutor"
    - "AI Engineer"
    - "Applied AI"
    - "AI Product Manager"
    - "Solutions Architect"
    - "Solutions Engineer"
    - "Forward Deployed"
    - "Deployment Strategist"
    - "Machine Learning"
    - "ML Engineer"
    - "LLMOps"
    - "Developer Advocate"
    - "DevRel"
    - "AI Researcher"
    - "AI Safety"
    - "AI Strategy"
    - "Head of AI"
    - "Founding Engineer"
    - "Customer Engineer"
    - "Field Engineer"
    - "GTM Engineer"
    - "Prompt Engineer"
    - "Voice AI"
    - "Conversational AI"
    - "Data Scientist"
    - "Research Scientist"
    - "Venture Partner"
    - "Startup Mentor"
    - "Startup Advisor"
    - "Entrepreneur in Residence"
    - "EIR"
    - "Fractional Chief of Staff"
    - "Fractional COO"
    - "Fractional Head of Strategy"
    - "Consultant"
    - "Strategy Consultant"
    - "Principal Consultant"
    - "Startup Consultant"
    - "Venture Builder"
    - "Head of Growth"
    - "Head of Business Operations"
    - "Remote"

  negative:
    # [CUSTOMIZE] Add keywords for roles you want to exclude
    - "Junior"
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
  seniority_boost:
    # These prefixes add relevance but are not required
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.

search_queries:
  # -- Ashby --
  - name: Ashby — Chief of Staff
    query: 'site:jobs.ashbyhq.com "Chief of Staff" OR "Head of Strategy" OR "Operations Lead" remote'
    enabled: true

  - name: Ashby — Strategy & Ops
    query: 'site:jobs.ashbyhq.com "Strategy & Operations" OR "Business Operations" remote'
    enabled: true

  - name: Ashby — Startup Mentoring & Advisory
    query: 'site:jobs.ashbyhq.com "Venture Partner" OR "EIR" OR "Startup Advisor" OR "Fractional" remote'
    enabled: true

  # -- Greenhouse --
  - name: Greenhouse — Chief of Staff
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Chief of Staff" OR "Head of Strategy" remote'
    enabled: true

  - name: Greenhouse — Remote AI & Startups
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "AI Transformation" OR "Solutions Architect" OR "Head of AI" remote'
    enabled: true


  - name: Greenhouse — Strategy & Ops
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Strategy & Operations" OR "Business Operations" remote'
    enabled: true

  # -- Lever --
  - name: Lever — Chief of Staff
    query: 'site:jobs.lever.co "Chief of Staff" OR "Head of Strategy" remote'
    enabled: true

  - name: Lever — Strategy & Ops
    query: 'site:jobs.lever.co "Strategy & Operations" OR "Business Operations" remote'
    enabled: true
  - name: Lever — AI PM
    query: 'site:jobs.lever.co "AI Product Manager" OR "Solutions Architect" AI remote'
    enabled: true

  - name: Lever — AI Roles
    query: 'site:jobs.lever.co "AI Engineer" OR "Agentic" OR "LLMOps" OR "Automation" remote'
    enabled: true

  # -- High Paying / Executive --
  - name: High Paying — Ashby
    query: 'site:jobs.ashbyhq.com "Chief of Staff" OR "AI" OR "Executive" "$200k" OR "$250k" OR "$300k" OR "$350k" remote'
    enabled: true

  - name: High Paying — Greenhouse
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Chief of Staff" OR "AI" OR "Executive" "$200k" OR "$250k" OR "$300k" OR "$350k" remote'
    enabled: true

  - name: High Paying — Lever
    query: 'site:jobs.lever.co "Chief of Staff" OR "AI" OR "Executive" "$200k" OR "$250k" OR "$300k" OR "$350k" remote'
    enabled: true

  # -- Wellfound (startups) --
  - name: Wellfound — AI PM
    query: 'site:wellfound.com "AI Product Manager" OR "AI Solutions" remote'
    enabled: true

  # -- Workable --
  - name: Workable — AI Roles
    query: 'site:apply.workable.com "AI" "Product Manager" OR "Solutions Architect" OR "AI Engineer" remote'
    enabled: true

  # -- No-Code / Low-Code / Automation --
  - name: Ashby — No-Code & Automation
    query: 'site:jobs.ashbyhq.com "no-code" OR "low-code" OR "automation engineer" OR "n8n" OR "Make" OR "Airtable" remote senior'
    enabled: true

  - name: Greenhouse — No-Code & Automation
    query: 'site:job-boards.greenhouse.io "no-code" OR "low-code" OR "automation engineer" OR "business systems" senior remote'
    enabled: true

  - name: GTM Engineer — All portals
    query: '"GTM Engineer" OR "RevOps Engineer" OR "Growth Engineer" automation Airtable OR Make OR Clay remote'
    enabled: true

  # -- Voice AI & Conversational AI --
